Slug: background-agents
Title: Build AI Agents that Never Sleep
Subtitle: Build durable Node.js agents with Inngest, event-driven execution, human approvals, and reliable recovery.

TeacherTitle: Netflix Engineer, Founder, & AI Builder
Teachers:
  - moss

Excerpt: Build an incident-response agent that watches a changing service, takes action, reaches you through an agent inbox, and resumes after events or failures. Learn how to put the harness in control with durable execution, human decisions, safe retries, and observable state.

Benefits:
  - Understand how background execution differs from a chat interface and when an agent needs a durable lifecycle.
  - Build a Node.js agent harness that observes current state, validates model-selected actions, and verifies completion.
  - Use Inngest to checkpoint model calls and tool execution so runs can resume after app restarts.
  - Suspend runs until events, timers, or human decisions arrive, then reassess the current state.
  - Require approval for disruptive actions and handle rejection, expiry, and changed conditions before execution.
  - Give the agent an inbox for approvals and questions so people can respond after the original request ends.
  - Make retries safe with action idempotency, timeouts, run limits, and cancellation.
  - Use a local event simulator and Inngest traces to reproduce failures and explain what a run did.
  - Evaluate outcomes, action trajectories, and authority boundaries instead of judging an agent only by its final report.
  - Leave with a working incident-response agent and a reference architecture you can adapt for your own background workflows.

Summary: >
  Give an agent a goal, close the tab, and return when it needs you. In this hands-on workshop, you'll build an incident-response agent that observes a changing service, chooses a remediation, reaches you through an agent inbox when it needs approval or an answer, verifies recovery, and produces an incident report.

  Starting with a small agent loop in Node.js and TypeScript, you'll put the harness in charge of state, action validation, and completion. Then you'll use Inngest to make execution durable, pause for external events and human decisions, and recover safely from failures. You'll deliberately restart the agent, duplicate events, and lose tool responses to see what durable execution handles and where application-level safeguards are still needed.

  A prebuilt local UI and event simulator keep the focus on the agent and its harness. Each lesson includes engineering discussion, live coding, Markdown notes with the exact code changes, and a catch-up break. An advanced incident lab challenges you to evaluate outcomes, unsafe trajectories, and uncertain side effects. Everything runs locally with your LLM API key; no deployment is required. By the end of the day, you'll have a working reference architecture and a clear mental model for when background agents are useful, how they pause and resume, and how to inspect their behavior.

Audience:
  Overview: This workshop is for developers who already have some JavaScript or TypeScript experience and want to move beyond chat-based AI demos into real agent systems. It is especially useful for full-stack engineers, backend engineers, and technical founders building automations, internal tools, or product features where work needs to continue asynchronously in the background. Prior agent experience is helpful but not required.

  Prerequisites:
    - Comfortable with modern JavaScript or TypeScript and basic Node.js development.
    - Able to run a local Node.js project, install dependencies with npm, and work from the terminal.
    - Familiarity with async/await, APIs, and basic server concepts.
    - Basic understanding of LLM APIs or prior use of an AI SDK is helpful, but not required.
    - Bring a laptop with Node.js LTS, npm, Git, and an editor already installed.
    - A working LLM API key with available usage credits is required for the hands-on exercises.

Agenda:
  Overview: Build an incident-response agent across six hands-on lessons, progressing from a goal-driven loop to durable execution, event-driven waiting, human approval, safe retries, and a final incident drill. Each lesson is followed by at least 15 minutes for a break and catch-up, with lunch after lesson three.
